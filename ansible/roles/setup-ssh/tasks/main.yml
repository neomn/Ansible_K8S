---
      
- name: Create ansible user
  user:
    name:        ansible
    group:       root
    home:        /home/ansible
    shell:       /bin/bash
    system:      no
    state:       present
    create_home: true

- name: add ssh public key to authorized_keys
  authorized_key:
    user: ansible
    state: present
    key: "{{ lookup('file', '/files/secrets/ssh_key.pub') }}"

- name: add ansible user to sudoers
  copy:
    src:   ../files/ansible_sudoer
    dest:  /etc/sudoers.d/
    owner: root
    group: root
    mode:  0440
      
- name: replace sshd_config file with my custom sshd_config
  template:
    src:   ../templates/sshd_config.j2
    dest:  /etc/ssh/sshd_config
    owner: root
    group: root
    mode:  0644
  notify: restart_ssh_service